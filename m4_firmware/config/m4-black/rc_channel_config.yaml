###### CAST version control manual #######
#channel 6 7 -> left face SA SB
#channel 8 -> right shouder SG (ARM)

# for any trigger:
# ^ : outer
# * : middle
# v : inner

## operation list ##
## drive mode:
# arm to drive mode -> change drive mode config -> drive -> disarm
# SG(ARM): middle -> SA: change in 3 state -> right stick -> SG(ARM): outer
## UAV mode:
# arm to drive mode -> transform to UAV config -> arm to UAV mode -> fly,landing -> disarm(or trans to drive)
# SG(ARM): middle -> SB: inner -> SG(ARM): inner -> fly control,left and right srick,landing -> SG(ARM): outer/middle


drive_mode:
    channel_id: 11
    stand: 993
    crouch1: 1497
    crouch2: 1994

