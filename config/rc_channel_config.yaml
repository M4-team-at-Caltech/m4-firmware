###### CAST White m4 control manual #######
# /mavros/in/rc id starts from 1
#channel 5 -> left face SB (Stand/crouch1/crouch2)
#channel 10 -> left face SC (Stand/-/Transform)
#channel 9 -> right shouder SG (Disarm/Drive/Fly)

# for any trigger:
# ^ : outer
# * : middle
# v : inner

## operation list ##
## drive mode:
# arm to drive mode -> change drive mode config -> drive -> disarm
# SG(ARM): middle -> SB: change in 3 state -> right stick -> SG(ARM): outer

## UAV mode:
# arm to drive mode -> transform to UAV config -> arm to UAV mode -> fly,landing -> disarm(or trans to drive)
# SG(ARM): middle -> SC: inner -> SG(ARM): inner -> fly control,left and right srick,landing -> SG(ARM): outer/middle

drive_mode:
    channel_id: 9
    stand: 1094
    crouch1: 1514
    crouch2: 1934

# mip_mode:
#     channel_id: 8
#     drive: 1094
#     mip_transform: 1514
#     mip_ready: 1934 
  
uav_mode:
    channel_id: 8
    drive: 1094
    uav_transform: 1934

    # 1094-1514-1934
    
x_velocity:
    channel_id: 2
    min: 1094
    zero: 1528
    max: 1934

y_velocity:
    channel_id: 1
    min: 1094
    zero: 1528
    max: 1934

velocity_deadzone: 0.05 # 0-1: percentage of velocity range to assign as deadzone.

arming:
    channel_id: 6
    disarm: 1094
    ground_mode_arm: 1514
    aerial_mode_arm: 1934

# AUTO mode switch (2-state)
# channel_id: TBD - confirm during hardware testing which physical switch to use
# manual: RC full control | auto: topic-driven control (/auto/mode_cmd, /auto/waypoint, /auto/cmd_vel)
# NOTE: RC DISARM always overrides AUTO mode regardless of this switch
auto_mode:
    channel_id: 10     # placeholder - update after hardware verification
    manual_pwm: 1094   # low  → MANUAL
    mid_pwm:    1514   # mid  → AUTO  (Option C: mid and high both activate AUTO)
    auto_pwm:   1934   # high → AUTO

