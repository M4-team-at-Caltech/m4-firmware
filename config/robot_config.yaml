#  this is for white m4, dynamixel calibrate on May/25/2026
interface_port: "/dev/U2D2"

baudrate: 2000000

log_path: "/home/jetson/log_temp"
log_buffer_size: 4000

control_loop_rate: 200

# Robot dimensions (for differential drive kinematics)
wheel_radius: 0.1 # Radius of the wheel in meters
wheel_base: 0.285 # Distance between left and right wheels in meters

# List of All joint ids defined below. Acive joint ids defined in executables
all_joint_ids: [1, 2, 3, 4, 5, 6, 7, 8]

# Joint names must match joint configurations below
joint_names: 
  - "FL_Frontal"
  - "FL_Saggital"
  - "FR_Frontal"
  - "FR_Saggital"
  - "BL_Frontal"
  - "BL_Saggital"
  - "BR_Frontal"
  - "BR_Saggital"

# Joint configurations
joints:
    # FL Leg
    FL_Frontal:
        id: 1              # Dynamixel motor ID
        zero_tick: 960     # Encoder tick corresponding to zero degrees position
        min_tick: 960      # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2085     # max_tick = max_position_degrees / 0.087891
        speed: 27.27       # degrees per second
    FL_Saggital:           
        # Reverse drive mode - CW = +ve, CCW = -ve
        id: 2             # Dynamixel motor ID
        zero_tick: 1040    # Encoder tick corresponding to zero degrees position
        min_tick: 1040     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2060    # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60         # degrees per second
    
    # FR Leg
    FR_Frontal:
        # Reverse drive mode - CW = +ve, CCW = -ve
        id: 3              # Dynamixel motor ID
        zero_tick: 980     # Encoder tick corresponding to zero degrees position
        min_tick: 980      # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2085     # max_tick = max_position_degrees / 0.087891
        speed: 27.27          # degrees per second
    FR_Saggital:
        id: 4              # Dynamixel motor ID
        zero_tick: 1040    # Encoder tick corresponding to zero degrees position
        min_tick: 1040     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2035     # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60  

    # BL Leg
    BL_Frontal:
         # Reverse drive mode - CW = +ve, CCW = -ve
        id: 5              # Dynamixel motor ID
        zero_tick: 980    # Encoder tick corresponding to zero degrees position
        min_tick: 980     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2090     # max_tick = max_position_degrees / 0.087891
        speed: 27.27       # degrees per second
    BL_Saggital:
        id: 6              # Dynamixel motor ID
        zero_tick: 1040    # Encoder tick corresponding to zero degrees position
        min_tick: 1040  # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2025     # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60          # degrees per second

    # BR Leg
    BR_Frontal:
        id: 7              # Dynamixel motor ID
        zero_tick: 960    # Encoder tick corresponding to zero degrees position
        min_tick: 960     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2060     # max_tick = max_position_degrees / 0.087891
        speed: 27.27          # degrees per second
    BR_Saggital:
        id: 8              # Dynamixel motor ID
        zero_tick: 1024    # Encoder tick corresponding to zero degrees position
        min_tick: 1024     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2035     # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60          # degrees per second

# List of All wheel ids defined below. Acive wheel ids defined in executables
all_wheel_ids: [9, 10, 11, 12]

# Wheel names must match wheel configurations below
wheel_names:
  - "FL_Wheel"
  - "FR_Wheel"
  - "BL_Wheel"
  - "BR_Wheel"

# Wheel configurations
wheels:
    FL_Wheel:           
        id: 9             # Dynamixel motor ID
        min_speed: -330   # min_speed = min_speed_degrees_per_second / 1.374 (rev/min)
        max_speed: 330    # max_speed = max_speed_degrees_per_second / 1.374 (rev/min)
    FR_Wheel:
        id: 10            # Dynamixel motor ID
        min_speed: -330   # min_speed = min_speed_degrees_per_second / 1.374 (rev/min)
        max_speed: 330    # max_speed = max_speed_degrees_per_second / 1.374 (rev/min)
    BL_Wheel:
        id: 11             # Dynamixel motor ID
        min_speed: -330   # min_speed = min_speed_degrees_per_second / 1.374 (rev/min)
        max_speed: 330    # max_speed = max_speed_degrees_per_second / 1.374 (rev/min)
    BR_Wheel:
        id: 12            # Dynamixel motor ID
        min_speed: -330   # min_speed = min_speed_degrees_per_second / 1.374 (rev/min)
        max_speed: 330    # max_speed = max_speed_degrees_per_second / 1.374 (rev/min)

# Standard Configurations    
config_stand: [0, 0, 0, 0, 0, 0, 0, 0]
config_crouch1: [0, 40, 0, 40, 0, 40, 0, 40]
config_crouch2: [0, 80, 0, 80, 0, 80, 0, 80]
config_sit: [0, 90, 0, 90, 0, 90, 0, 90]
config_uav_step1: [40, 90, 40, 90, 40, 90, 40, 90]
config_uav_step2: [90, 0, 90, 0, 90, 0, 90, 0]
config_uav: [90, 0, 90, 0, 90, 0, 90, 0]
config_mip: [90, 45, 90, 45, 0, 90, 0, 90]
config_transition_wheel_vel: 150  # In rev/min

# Simulation mode: Gazebo ROS bridge topic prefix
# topic_prefix: model name prefix used by gz_ros_bridge, e.g. "/Drone1"
simulation:
    topic_prefix: "/Drone1"
    max_linear_vel: 1.0     # m/s  — clamp on drive() input (layer 1)
    max_angular_vel: 0.5    # rad/s — clamp on drive() input (layer 1)
    max_wheel_vel: 10.0     # rad/s — clamp on wheel output before publishing (layer 2)

# AUTO mode: odometry source configuration
# odom_source: "fastlio" | "mocap"
#   fastlio -> subscribes to odom_topic, forwards to /fmu/in/vehicle_visual_odometry
#   mocap   -> subscribes to odom_topic, forwards to /fmu/in/vehicle_mocap_odometry
# odom_topic: ROS topic name for the odometry input (nav_msgs/Odometry)
# odom_timeout_s: seconds without odom before declaring unhealthy (blocks aerial ARM)
auto_mode:
    odom_source: "fastlio"
    # odom_topic: "/localization/odom"
    # odom_source: "mocap"
    odom_topic: "/Drone1/groundtruth_odom"
    odom_timeout_s: 0.5
    odom_lost_descent_mps: 0.3   # emergency descent speed (m/s) when odom is lost (DESCENDING state)
    arm_imu_wait_s: 3.0          # wait after UAV transform before sending ARM (IMU settle time)
    arm_retry_window_s: 3.0      # max time to retry ARM after each attempt (seconds)
    waypoint_timeout_s: 2.0      # aerial waypoint staleness threshold; hover at current odom if exceeded
    landing_descent_mps: 0.3     # controlled descent rate during LANDING (m/s, pending calibration)
    landing_z_stop_thr: 0.05     # odom Z velocity threshold to detect touchdown (m/s, fallback)
    landing_z_stop_dur: 1.0      # seconds Z velocity must stay below threshold to confirm touchdown
