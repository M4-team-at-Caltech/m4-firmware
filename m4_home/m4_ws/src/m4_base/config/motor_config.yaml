# Control table address - XM540-W270-R
# Control table address is different in different Dynamixel model
ADDR_TORQUE_ENABLE: 64    
ADDR_GOAL_POSITION: 116
ADDR_GOAL_VELOCITY: 104
ADDR_MOVEMENT_SPEED: 112
ADDR_MOVING_STATUS: 122
ADDR_PRESENT_CURRENT: 126
ADDR_PRESENT_VELOCITY: 128
ADDR_PRESENT_POSITION: 132

# Data Byte Length
LEN_TORQUE_ENABLE: 1
LEN_GOAL_POSITION: 4
LEN_GOAL_VELOCITY: 4
LEN_MOVEMENT_SPEED: 4
LEN_MOVING_STATUS: 1
LEN_PRESENT_POSITION: 4
LEN_PRESENT_VELOCITY: 4
LEN_PRESENT_CURRENT: 2

# Units multiplier
# Multiply to convert to, divide to convert from given units
MULT_SPEED: 1.374       # Multiply to convert from rotations per minute to degrees per second
MULT_POSITION: 0.087891 # Multiply to convert from ticks to degrees
MULT_CURRENT: 0.00269   # Multiply to convert from Dynamixel's unknown units to ma

# Protocol version
PROTOCOL_VERSION:  2.0  # See which protocol version is used in the Dynamixel

# Default setting
TORQUE_ENABLE: 1        # Value for enabling the torque
TORQUE_DISABLE: 0       # Value for disabling the torque