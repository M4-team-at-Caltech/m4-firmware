interface_port: "/dev/U2D2"
baudrate: 115200

log_path: "/home/m4/data"
log_buffer_size: 1000

control_loop_rate: 200

# List of All joint ids defined below. Acive joint ids defined in executables
all_joint_ids: [1, 2, 3, 4, 5, 6, 7, 8]

# Joint names must match joint configurations below
joint_names: 
  - "FL_Frontal"
  - "FL_Saggital"
  - "FR_Frontal"
  - "FR_Saggital"
  - "BL_Frontal"
  - "BL_Saggital"
  - "BR_Frontal"
  - "BR_Saggital"

# Joint configurations
joints:
    # FL Leg
    FL_Frontal:
        id: 1              # Dynamixel motor ID
        zero_tick: 1028    # Encoder tick corresponding to zero degrees position
        min_tick: 1028     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2068     # max_tick = max_position_degrees / 0.087891
        speed: 60          # degrees per second
    FL_Saggital:           
        # Reverse drive mode - CW = +ve, CCW = -ve
        id: 2              # Dynamixel motor ID
        zero_tick: 1015    # Encoder tick corresponding to zero degrees position
        min_tick: 794     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2252     # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60          # degrees per second
    
    # FR Leg
    FR_Frontal:
        # Reverse drive mode - CW = +ve, CCW = -ve
        id: 3              # Dynamixel motor ID
        zero_tick: 1040    # Encoder tick corresponding to zero degrees position
        min_tick: 1040     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2067     # max_tick = max_position_degrees / 0.087891
        speed: 60          # degrees per second
    FR_Saggital:
        id: 4              # Dynamixel motor ID
        zero_tick: 1175    # Encoder tick corresponding to zero degrees position
        min_tick: 922      # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2380     # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60          # degrees per second

    # BL Leg
    BL_Frontal:
         # Reverse drive mode - CW = +ve, CCW = -ve
        id: 5              # Dynamixel motor ID
        zero_tick: 1013    # Encoder tick corresponding to zero degrees position
        min_tick: 1013     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2059     # max_tick = max_position_degrees / 0.087891
        speed: 60          # degrees per second
    BL_Saggital:
        id: 6              # Dynamixel motor ID
        zero_tick: 1037    # Encoder tick corresponding to zero degrees position
        min_tick: 792      # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2255     # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60          # degrees per second

    # BR Leg
    BR_Frontal:
        id: 7              # Dynamixel motor ID
        zero_tick: 2570    # Encoder tick corresponding to zero degrees position
        min_tick: 2570     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 3585     # max_tick = max_position_degrees / 0.087891
        speed: 60          # degrees per second
    BR_Saggital:
        id: 8              # Dynamixel motor ID
        zero_tick: 1030    # Encoder tick corresponding to zero degrees position
        min_tick: 776      # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2242     # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60          # degrees per second

# Standard Configurations    
config_stand: [0, 0, 0, 0, 0, 0, 0, 0]
config_crouch1: [0, 60, 0, 60, 0, 60, 0, 60]
config_crouch2: [0, 90, 0, 90, 0, 90, 0, 90]
config_sit: [0, 110, 0, 110, 0, 110, 0, 110]
config_uav: [90, 0.7, 90, 0.7, 90, 0.7, 90, 0.7]
config_mip: [90, 45, 90, 45, 0, 90, 0, 90]
