interface_port: "/dev/U2D2"
baudrate: 115200

log_path: "/home/m4/data"
log_buffer_size: 400

control_loop_rate: 200

# List of All joint ids defined below. Acive joint ids defined in executables
all_joint_ids: [1, 2, 3, 4, 5, 6, 7, 8]

# Joint names must match joint configurations below
joint_names: 
  - "FL_Frontal"
  - "FL_Saggital"
  - "FR_Frontal"
  - "FR_Saggital"
  - "BL_Frontal"
  - "BL_Saggital"
  - "BR_Frontal"
  - "BR_Saggital"

# Joint configurations
joints:
    # FL Leg
    FL_Frontal:
        id: 1              # Dynamixel motor ID
        zero_tick: 886    # Encoder tick corresponding to zero degrees position
        min_tick: 886     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 1926     # max_tick = max_position_degrees / 0.087891
        speed: 30          # degrees per second
    FL_Saggital:           
        # Reverse drive mode - CW = +ve, CCW = -ve
        id: 2              # Dynamixel motor ID
        zero_tick: 1010    # Encoder tick corresponding to zero degrees position
        min_tick: 810      # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2230     # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60          # degrees per second
    
    # FR Leg
    FR_Frontal:
        # Reverse drive mode - CW = +ve, CCW = -ve
        id: 3              # Dynamixel motor ID
        zero_tick: 1082    # Encoder tick corresponding to zero degrees position
        min_tick: 1082     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2065     # max_tick = max_position_degrees / 0.087891
        speed: 30          # degrees per second
    FR_Saggital:
        id: 4              # Dynamixel motor ID
        zero_tick: 1150    # Encoder tick corresponding to zero degrees position
        min_tick: 930      # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2360     # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60          # degrees per second

    # BL Leg
    BL_Frontal:
         # Reverse drive mode - CW = +ve, CCW = -ve
        id: 5              # Dynamixel motor ID
        zero_tick: 1042    # Encoder tick corresponding to zero degrees position
        min_tick: 1042     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2061     # max_tick = max_position_degrees / 0.087891
        speed: 30          # degrees per second
    BL_Saggital:
        id: 6              # Dynamixel motor ID
        zero_tick: 1027    # Encoder tick corresponding to zero degrees position
        min_tick: 800      # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2200     # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60          # degrees per second

    # BR Leg
    BR_Frontal:
        id: 7              # Dynamixel motor ID
        zero_tick: 2557    # Encoder tick corresponding to zero degrees position
        min_tick: 2557     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 3585     # max_tick = max_position_degrees / 0.087891
        speed: 30          # degrees per second
    BR_Saggital:
        id: 8              # Dynamixel motor ID
        zero_tick: 130     # Encoder tick corresponding to zero degrees position
        min_tick: 50       # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 1350     # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60          # degrees per second

# Standard Configurations    
config_stand: [0, 0, 0, 0, 0, 0, 0, 0]
config_crouch: [0, 60, 0, 60, 0, 60, 0, 60]
config_sit: [0, 90, 0, 90, 0, 90, 0, 90]
config_uav: [90, 60, 90, 60, 90, 60, 90, 60]
config_mip: [90, 60, 90, 60, 0, 90, 0, 90]
