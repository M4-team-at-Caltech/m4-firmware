interface_port: "/dev/U2D2"
baudrate: 2000000

log_path: "/home/m4/data"
log_buffer_size: 4000

control_loop_rate: 200

# List of All joint ids defined below. Acive joint ids defined in executables
all_joint_ids: [1, 2, 3, 4, 5, 6, 7, 8]

# Joint names must match joint configurations below
joint_names: 
  - "FL_Frontal"
  - "FL_Saggital"
  - "FR_Frontal"
  - "FR_Saggital"
  - "BL_Frontal"
  - "BL_Saggital"
  - "BR_Frontal"
  - "BR_Saggital"

# Joint configurations
joints:
    # FL Leg
    FL_Frontal:
        id: 1              # Dynamixel motor ID
        zero_tick: 850     # Encoder tick corresponding to zero degrees position
        min_tick: 850      # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 1751     # max_tick = max_position_degrees / 0.087891
        speed: 27.27       # degrees per second
    FL_Saggital:           
        # Reverse drive mode - CW = +ve, CCW = -ve
        id: 2             # Dynamixel motor ID
        zero_tick: 1669   # Encoder tick corresponding to zero degrees position
        min_tick: 1669    # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2713    # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60         # degrees per second
    
    # FR Leg
    FR_Frontal:
        # Reverse drive mode - CW = +ve, CCW = -ve
        id: 3              # Dynamixel motor ID
        zero_tick: 915     # Encoder tick corresponding to zero degrees position
        min_tick: 915      # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 1946     # max_tick = max_position_degrees / 0.087891
        speed: 27.27          # degrees per second
    FR_Saggital:
        id: 4              # Dynamixel motor ID
        zero_tick: 849     # Encoder tick corresponding to zero degrees position
        min_tick: 849      # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 1811     # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60          # degrees per second

    # BL Leg
    BL_Frontal:
         # Reverse drive mode - CW = +ve, CCW = -ve
        id: 5              # Dynamixel motor ID
        zero_tick: 217     # Encoder tick corresponding to zero degrees position
        min_tick: 217      # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 1211     # max_tick = max_position_degrees / 0.087891
        speed: 27.27       # degrees per second
    BL_Saggital:
        id: 6              # Dynamixel motor ID
        zero_tick: 1322    # Encoder tick corresponding to zero degrees position
        min_tick: 1322     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2370     # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60          # degrees per second

    # BR Leg
    BR_Frontal:
        id: 7              # Dynamixel motor ID
        zero_tick: 2257    # Encoder tick corresponding to zero degrees position
        min_tick: 2257     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 3258     # max_tick = max_position_degrees / 0.087891
        speed: 27.27          # degrees per second
    BR_Saggital:
        id: 8              # Dynamixel motor ID
        zero_tick: 1740    # Encoder tick corresponding to zero degrees position
        min_tick: 1740     # min_tick = min_position_degrees / 0.087891 + zero_tick
        max_tick: 2779     # max_tick = max_position_degrees / 0.087891 + zero_tick
        speed: 60          # degrees per second

# List of All wheel ids defined below. Acive wheel ids defined in executables
all_wheel_ids: [9, 10, 11, 12]

# Wheel names must match wheel configurations below
wheel_names:
  - "FL_Wheel"
  - "FR_Wheel"
  - "BL_Wheel"
  - "BR_Wheel"

# Wheel configurations
wheels:
    FL_Wheel:           
        id: 9             # Dynamixel motor ID
        min_speed: -330   # min_speed = min_speed_degrees_per_second / 1.374
        max_speed: 330    # max_speed = max_speed_degrees_per_second / 1.374
    FR_Wheel:
        id: 10            # Dynamixel motor ID
        min_speed: -330   # min_speed = min_speed_degrees_per_second / 1.374
        max_speed: 330    # max_speed = max_speed_degrees_per_second / 1.374
    BL_Wheel:           
        id: 11             # Dynamixel motor ID
        min_speed: -330   # min_speed = min_speed_degrees_per_second / 1.374
        max_speed: 330    # max_speed = max_speed_degrees_per_second / 1.374
    BR_Wheel:
        id: 12            # Dynamixel motor ID
        min_speed: -330   # min_speed = min_speed_degrees_per_second / 1.374
        max_speed: 330    # max_speed = max_speed_degrees_per_second / 1.374


# Standard Configurations    
config_stand: [0, 0, 0, 0, 0, 0, 0, 0]
config_crouch1: [0, 40, 0, 40, 0, 40, 0, 40]
config_crouch2: [0, 80, 0, 80, 0, 80, 0, 80]
config_sit: [0, 90, 0, 90, 0, 90, 0, 90]
config_uav_step2: [40, 90, 40, 90, 40, 90, 40, 90]
config_uav_step1: [90, 0, 90, 0, 90, 0, 90, 0]
config_uav: [90, 0, 90, 0, 90, 0, 90, 0]
config_mip: [90, 45, 90, 45, 0, 90, 0, 90]
